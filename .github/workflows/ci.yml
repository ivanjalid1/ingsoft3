name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # deja la corrida que lee el badge y el cache que reusan los PRs

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # permisos por job (no a nivel workflow): mínimo privilegio, cada job pide solo lo que usa
    permissions:
      contents: read      # checkout
      packages: write     # publicar en ghcr.io
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests (backend)
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen de coverage (backend)
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del backend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Publicar va AL FINAL y sin !cancelled()/always(): si algo anterior falló,
      # este paso no corre. El orden ES la condición: solo se publica lo verificado.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}   # en PRs solo construye
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # permisos por job (no a nivel workflow): mínimo privilegio, cada job pide solo lo que usa
    permissions:
      contents: read      # checkout
      packages: write     # publicar en ghcr.io
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests (frontend)
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen de coverage (frontend)
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # Publicar va AL FINAL y sin !cancelled()/always(): si algo anterior falló,
      # este paso no corre. El orden ES la condición: solo se publica lo verificado.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}   # en PRs solo construye
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # TP6 · Despliegue continuo a QA.
  # needs + if = cadena con compuertas: solo corre en push a main y solo si los
  # dos builds (tests + coverage + publicación de imagen) terminaron en verde.
  # En un PR este job aparece como "skipped": no despliega nada sin merge.
  # ---------------------------------------------------------------------------
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # environment qa: los secrets/vars de este job salen del entorno "qa" (la key
    # SSH de QA no existe para ningún otro job) y GitHub guarda el historial de
    # despliegues con su URL.
    environment:
      name: qa
      url: https://qa.testingwebapp.site
    permissions:
      contents: read
    steps:
      # Se despliega por IMAGEN: las que este mismo pipeline verificó y publicó
      # como sha-<sha>. En el VPS no se reconstruye nada.
      # El sha va EXPLÍCITO (nunca "la punta de la rama"): si entre el push y
      # este paso alguien mergea otra cosa, QA igual recibe exactamente el commit
      # que pasó las compuertas. Es el equivalente al &ref= del deploy hook de Render.
      - name: Desplegar en QA el commit verificado (por SSH al VPS)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/deploy_key"
          KNOWN="$RUNNER_TEMP/known_hosts"
          # La key se borra al salir pase lo que pase (éxito, error o cancelación).
          trap 'rm -f "$KEY" "$KNOWN"' EXIT
          ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"; printf '%s\n' "$VPS_KNOWN_HOSTS" > "$KNOWN" )
          # StrictHostKeyChecking=yes + known_hosts fijo: si el VPS no es el que
          # esperamos, no se conecta (nada de "aceptar cualquier host").
          # En el VPS la key tiene un forced command: lo ÚNICO que puede hacer es
          # desplegar QA, y lo único que recibe es el sha (40 hex, validado allá).
          ssh -i "$KEY" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$KNOWN" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            tp6deploy@"$VPS_HOST" "$GITHUB_SHA"

      # "up -d" terminado no significa "QA sirviendo ESTE commit". El smoke test
      # pide que /api/health informe version == GITHUB_SHA: así cierra el hueco de
      # dar verde contra la versión vieja que todavía estaba corriendo.
      - name: Smoke test (espera a que QA conteste con ESTE commit)
        shell: bash
        env:
          URL: https://qa.testingwebapp.site
        run: |
          for i in $(seq 1 30); do
            HEALTH=""
            VERSION=""
            if HEALTH=$(curl -fsS --max-time 10 "$URL/api/health"); then
              # Si no es JSON, VERSION queda vacía y cuenta como versión equivocada.
              VERSION=$(jq -r '.version // empty' <<<"$HEALTH" 2>/dev/null || true)
            fi
            if [ -z "$HEALTH" ]; then
              echo "[$i/30] /api/health no responde 200"
            elif [ "$VERSION" != "$GITHUB_SHA" ]; then
              echo "[$i/30] /api/health responde la versión '${VERSION:-?}', se espera $GITHUB_SHA"
            elif ! curl -fsS --max-time 10 -o /dev/null "$URL/api/health/db"; then
              echo "[$i/30] /api/health/db no responde 200 (la base o el esquema no están)"
            elif ! curl -fsS --max-time 10 -o /dev/null "$URL/"; then
              echo "[$i/30] / (frontend) no responde 200"
            else
              echo "QA sirve el commit $GITHUB_SHA: health, base y frontend OK"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Smoke test fallido: QA no quedó sirviendo el commit $GITHUB_SHA con health, base y frontend OK después de 30 intentos (~10 min)"
          exit 1
