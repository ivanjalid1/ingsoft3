name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # deja la corrida que lee el badge y el cache que reusan los PRs

jobs:
  build-backend:
    runs-on: ubuntu-latest
    # permisos por job (no a nivel workflow): mínimo privilegio, cada job pide solo lo que usa
    permissions:
      contents: read      # checkout
      packages: write     # publicar en ghcr.io
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests (backend)
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen de coverage (backend)
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del backend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      # Publicar va AL FINAL y sin !cancelled()/always(): si algo anterior falló,
      # este paso no corre. El orden ES la condición: solo se publica lo verificado.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}   # en PRs solo construye
          tags: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    # permisos por job (no a nivel workflow): mínimo privilegio, cada job pide solo lo que usa
    permissions:
      contents: read      # checkout
      packages: write     # publicar en ghcr.io
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests (frontend)
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen de coverage (frontend)
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar coverage del frontend
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # Publicar va AL FINAL y sin !cancelled()/always(): si algo anterior falló,
      # este paso no corre. El orden ES la condición: solo se publica lo verificado.
      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}   # en PRs solo construye
          tags: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # TP6 · Despliegue continuo a QA.
  # needs + if = cadena con compuertas: solo corre en push a main y solo si los
  # dos builds (tests + coverage + publicación de imagen) terminaron en verde.
  # En un PR este job aparece como "skipped": no despliega nada sin merge.
  # ---------------------------------------------------------------------------
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # environment qa: los secrets/vars de este job salen del entorno "qa" (la key
    # SSH de QA no existe para ningún otro job) y GitHub guarda el historial de
    # despliegues con su URL.
    environment:
      name: qa
      url: https://qa.testingwebapp.site
    permissions:
      contents: read
    steps:
      # La acción compuesta vive en el repo: hay que bajarla primero. Alcanza con
      # .github (sparse): este job no construye nada, solo despliega imágenes.
      - name: Bajar la acción de despliegue
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      # Despliegue + smoke test (ver .github/actions/deploy-vps/action.yml).
      # El sha va EXPLÍCITO: QA recibe exactamente el commit que pasó las compuertas.
      - name: Desplegar en QA el commit verificado y hacer smoke test
        uses: ./.github/actions/deploy-vps
        with:
          url: https://qa.testingwebapp.site
          sha: ${{ github.sha }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}     # la key del environment "qa"
          host: ${{ vars.VPS_HOST }}
          known-hosts: ${{ vars.VPS_KNOWN_HOSTS }}

  # ---------------------------------------------------------------------------
  # TP7 · Pruebas contra QA como compuerta antes de PROD.
  #
  #   build-* → deploy-qa → integracion → e2e → deploy-prod (aprobación manual)
  #
  # Sin "if" propio: heredan el de deploy-qa por needs. En un PR quedan
  # "skipped" (no hay QA nuevo que probar); en push a main corren contra el
  # commit que deploy-qa acaba de dejar sirviendo (su smoke ya verificó que
  # /api/health devuelve version == sha). Si cualquiera falla, la cadena se
  # corta y PROD ni siquiera pide aprobación.
  #
  # Host único: el backend no se publica aparte, la API se alcanza por el mismo
  # host del front en /api (proxy de nginx). Por eso API_BASE_URL y E2E_BASE_URL
  # son la misma URL de QA.
  #
  # Usuario de prueba: e2e@erp.local existe SOLO en la base de QA (en PROD no).
  # Usuario en vars.QA_E2E_USER y contraseña en secrets.QA_E2E_PASSWORD (nivel
  # repositorio: estos jobs no usan environment porque no tocan el VPS).
  #
  # Diagnóstico rápido cuando algo se pone rojo:
  #   | falla          | pasa           | dónde mirar                                        |
  #   |----------------|----------------|----------------------------------------------------|
  #   | deploy-qa      | —              | despliegue/smoke: el VPS, la imagen o /api/health  |
  #   | integracion    | —              | API o base de QA (contrato HTTP, validaciones, BD) |
  #   | e2e            | integracion    | la UI: front, labels/roles, flujo del navegador    |
  #   | e2e e integr.  | deploy-qa      | algo común: login/usuario de prueba o datos de QA  |
  # El reporte HTML de Playwright (con trace y screenshot del fallo) queda como
  # artifact de cada job.
  # ---------------------------------------------------------------------------
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tp2/frontend
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node 22 con cache de npm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tp2/frontend/package-lock.json

      # Sin navegador: la suite de integración usa solo el fixture `request`.
      - name: Instalar dependencias
        run: npm ci

      # Antes de Playwright: si QA no responde desde ESTE runner, cortamos acá
      # con un mensaje claro en vez de esperar timeouts de las pruebas. La IP
      # pública del runner queda en el log para buscarla en los logs del VPS la
      # próxima vez que haya un corte de red (corrida 37833222579).
      - name: Comprobar que QA es alcanzable desde este runner
        env:
          BASE: https://qa.testingwebapp.site
        run: |
          echo "IP pública de este runner: $(curl -s --max-time 10 https://api.ipify.org || echo desconocida)"
          if ! curl -sS --retry 5 --retry-all-errors --retry-delay 5 --max-time 10 \
               -o /dev/null -w '%{http_code} %{time_total}s\n' "$BASE/api/health"; then
            echo "::error::QA ($BASE/api/health) no es alcanzable desde este runner: corte de red entre GitHub y el VPS, no un fallo de las pruebas."
            exit 1
          fi

      - name: Pruebas de integración contra la API de QA
        env:
          API_BASE_URL: https://qa.testingwebapp.site
          QA_E2E_USER: ${{ vars.QA_E2E_USER }}
          QA_E2E_PASSWORD: ${{ secrets.QA_E2E_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/resultados.json
        run: npx playwright test e2e/api.spec.js --reporter=list,html,json

      - name: Resumen de integración
        run: |
          node -e "
            const s = require('./test-results/resultados.json').stats;
            console.log('### Integración contra QA');
            console.log(\`\${s.expected} pasaron · \${s.flaky} flaky · \${s.unexpected} fallaron · \${s.skipped} salteadas\`);
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de Playwright (integración)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion
          path: |
            tp2/frontend/playwright-report
            tp2/frontend/test-results
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: integracion
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tp2/frontend
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar Node 22 con cache de npm
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tp2/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Solo Chromium (+ las librerías del sistema que necesita): es el único
      # proyecto definido en playwright.config.js.
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      # Igual que en integracion: si QA no responde desde ESTE runner, cortamos
      # con un mensaje claro. La IP queda en el log para buscarla en los logs del
      # VPS (en la corrida 37833222579 ningún request de este job llegó al VPS).
      - name: Comprobar que QA es alcanzable desde este runner
        env:
          BASE: https://qa.testingwebapp.site
        run: |
          echo "IP pública de este runner: $(curl -s --max-time 10 https://api.ipify.org || echo desconocida)"
          if ! curl -sS --retry 5 --retry-all-errors --retry-delay 5 --max-time 10 \
               -o /dev/null -w '%{http_code} %{time_total}s\n' "$BASE/login"; then
            echo "::error::QA ($BASE/login) no es alcanzable desde este runner: corte de red entre GitHub y el VPS, no un fallo de las pruebas."
            exit 1
          fi

      - name: Pruebas end-to-end en el navegador contra QA
        env:
          E2E_BASE_URL: https://qa.testingwebapp.site
          API_BASE_URL: https://qa.testingwebapp.site
          QA_E2E_USER: ${{ vars.QA_E2E_USER }}
          QA_E2E_PASSWORD: ${{ secrets.QA_E2E_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/resultados.json
        run: npx playwright test e2e/clientes.spec.js --reporter=list,html,json

      - name: Resumen de e2e
        run: |
          node -e "
            const s = require('./test-results/resultados.json').stats;
            console.log('### E2E en navegador contra QA');
            console.log(\`\${s.expected} pasaron · \${s.flaky} flaky · \${s.unexpected} fallaron · \${s.skipped} salteadas\`);
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de Playwright (e2e)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: |
            tp2/frontend/playwright-report
            tp2/frontend/test-results
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # TP6 · Despliegue a PROD con aprobación manual.
  # Sin "if" propio a propósito: needs ya lo hereda. TP7: ahora depende de e2e
  # (que a su vez depende de integracion → deploy-qa). Si cualquier eslabón se
  # saltea (PR) o falla (QA roto, smoke rojo, integración o e2e en rojo), este
  # job se saltea también; por defecto un job solo corre si TODOS sus needs
  # terminaron en success. Así PROD solo recibe un commit que ya está sirviendo
  # bien en QA y pasó las pruebas contra QA.
  # ---------------------------------------------------------------------------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e
    # environment production: tiene "required reviewers", así que el workflow se
    # PAUSA acá hasta que alguien autorizado apruebe en la pestaña Actions. Recién
    # entonces el job arranca y recibe los secrets del entorno production (la key
    # SSH de PROD no existe para ningún otro job ni entorno).
    environment:
      name: production
      url: https://prod.testingwebapp.site
    # concurrency: nunca dos despliegues a PROD solapados (el rollback usa el mismo
    # grupo). cancel-in-progress: false = no se corta un deploy a la mitad.
    # OJO: esto NO ordena la cola de aprobaciones. Si quedan pendientes las corridas
    # A (vieja) y B (nueva), aprobar A después de B volvería a A: las corridas
    # viejas se rechazan a mano.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Bajar la acción de despliegue
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github

      # El sha es el de ESTA corrida (github.sha), no "lo último de main": aprobar
      # la corrida A despliega A aunque mientras tanto se haya mergeado B.
      - name: Desplegar en PROD el commit aprobado y hacer smoke test
        uses: ./.github/actions/deploy-vps
        with:
          url: https://prod.testingwebapp.site
          sha: ${{ github.sha }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}     # la key del environment "production": solo puede desplegar PROD
          host: ${{ vars.VPS_HOST }}
          known-hosts: ${{ vars.VPS_KNOWN_HOSTS }}
