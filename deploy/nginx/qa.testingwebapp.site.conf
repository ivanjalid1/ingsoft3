# ---------------------------------------------------------------------------
# TP6 · Copia del vhost de nginx del host para QA (qa.testingwebapp.site).
# Instalado en: /etc/nginx/sites-available/qa.testingwebapp.site.conf
#   (con symlink en /etc/nginx/sites-enabled/).
# Las líneas marcadas "# managed by Certbot" (listen 443, ssl_certificate*,
# include/ssl_dhparam y el redirect 80 -> 443) las agrega y mantiene certbot
# ("certbot --nginx -d qa.testingwebapp.site"): no se escriben a mano. Son
# rutas a certificados, no secretos.
# Copia de referencia: el VPS es quien manda; si se cambia allá, actualizar acá.
# ---------------------------------------------------------------------------
# ingsoft3 TP6 (ivanjalid1/ingsoft3-tp01) — entorno QA
server {
    server_name qa.testingwebapp.site;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qa.testingwebapp.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qa.testingwebapp.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = qa.testingwebapp.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name qa.testingwebapp.site;
    return 404; # managed by Certbot


}
